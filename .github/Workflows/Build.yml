name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          cp index.html www/index.html
          npx cap init "MSN Lyrics" com.msnlyrics.app --web-dir=www
          npx cap add android

      - name: Generate icons
        run: |
          mkdir -p assets
          convert icon.png -resize 1024x1024! assets/icon-only.png
          convert icon.png -resize 680x680 -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
          npm i @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#000000'

      - name: Sync project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MSN-Lyrics-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
